<style>
/* Layout: a library card catalogue. Topic strip on top, sticky filters, then a grid of index cards with call numbers. */
:root{
  --paper:#f2f3ef; --card:#ffffff; --ink:#1c2422; --muted:#5d6864; --line:#d5d9d3;
  --accent:#1f5c58; --accent-ink:#ffffff; --mark:#e7c23f; --chip:#e6ebe7; --edit:#fff6d6;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121816; --card:#1a2220; --ink:#e6ece9; --muted:#9aa7a2; --line:#2c3633;
  --accent:#6fc2b9; --accent-ink:#0d1513; --mark:#d9b437; --chip:#22302c; --edit:#2c2a1c; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121816; --card:#1a2220; --ink:#e6ece9; --muted:#9aa7a2; --line:#2c3633;
  --accent:#6fc2b9; --accent-ink:#0d1513; --mark:#d9b437; --chip:#22302c; --edit:#2c2a1c; color-scheme:dark }
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:grid;gap:8px;border-bottom:3px solid var(--ink);padding-bottom:18px}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,8vw,84px);line-height:.9;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.lede{max-width:66ch;margin:0;color:var(--muted)}
.lede b,.lede strong{color:var(--ink);font-weight:600}
.lede a,footer a{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}

.strip{margin-top:22px;display:grid;gap:10px}
.strip-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.strip-head h2{font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase;margin:0;letter-spacing:.03em}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.topic{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;
  padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:4px;font-size:15px}
.topic:hover{border-color:var(--accent)}
.topic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topic[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.topic[aria-pressed="true"] .code,.topic[aria-pressed="true"] .n{color:var(--accent-ink)}
.code{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500}
.n{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:3px;background:var(--chip);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;opacity:.55}

.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  margin-top:22px;padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.controls input[type=search],.controls select{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:4px;padding:9px 11px;min-width:0;max-width:100%}
.controls input[type=search]{flex:1 1 260px}
.controls select{flex:0 1 auto}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.link{font:inherit;font-size:14px;background:none;border:none;color:var(--accent);cursor:pointer;text-decoration:underline;padding:4px}

.grid{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:16px 18px 14px;display:grid;
  grid-template-rows:auto auto auto 1fr auto;gap:8px;min-width:0;
  background-image:linear-gradient(var(--line),var(--line));background-size:100% 1px;background-position:0 44px;background-repeat:no-repeat}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;height:22px}
.call{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.04em}
.year{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.title{font-size:19px;line-height:1.25;font-weight:600;margin:6px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.authors{font-size:15px;overflow-wrap:anywhere}
.src{font-size:14px;color:var(--muted);font-style:italic}
.sum{font-size:15px;color:var(--muted);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:3px 7px;border-radius:2px;background:var(--chip);color:var(--ink)}
.tag.own{background:var(--mark);color:#1c2422}
.tag.col{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.tag.lock{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;padding-top:10px;border-top:1px dashed var(--line)}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.02em;text-decoration:none;border-radius:3px;padding:7px 10px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.08)}
.more{display:flex;justify-content:center;margin-top:22px}
.empty{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--muted)}
footer{margin-top:40px;padding-top:16px;border-top:3px solid var(--ink);display:grid;gap:8px;font-size:14px;color:var(--muted);max-width:75ch}
footer p{margin:0}
footer b,footer strong{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);
  font-family:var(--mono);font-size:13px;padding:9px 14px;border-radius:4px;z-index:30}

/* Edit mode */
.editbtn{font-family:var(--mono);font-size:12px;padding:7px 10px;border-radius:3px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
body.editing [data-edit],body.editing .tlabel{background:var(--edit);outline:1px dashed var(--mark);outline-offset:3px;border-radius:2px;cursor:text}
body.editing .topic{cursor:default}
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.editbar .msg{flex:1 1 240px;min-width:0}
.editbar button{font-family:var(--mono);font-size:13px;padding:8px 12px;border-radius:3px;cursor:pointer;border:1px solid var(--paper)}
.editbar .save{background:var(--mark);color:#1c2422;border-color:var(--mark)}
.editbar .cancel{background:transparent;color:var(--paper)}
.addp{justify-self:start}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
.portada{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,6vh,48px);padding:24px 16px;overflow:auto}
.portada canvas{width:min(384px,88vw);aspect-ratio:64/40;image-rendering:pixelated;display:block}
.portada .entrar{font-family:'Press Start 2P',monospace;font-size:clamp(11px,3.4vw,15px);line-height:1.6;color:#fff;background:#000;border:4px solid #fff;outline:4px solid #000;box-shadow:0 0 0 8px #fff;padding:16px 20px;cursor:pointer;max-width:100%}
.portada .entrar:hover,.portada .entrar:focus-visible{background:#fff;color:#000}
.portada .entrar:focus-visible{outline-color:#e7c23f}
body.cubierta{overflow:hidden}
[hidden]{display:none!important}
.outro{gap:clamp(18px,4vh,32px);text-align:center}
.outro .otit{font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.6vw,17px);line-height:1.7;color:#fff;margin:0;max-width:30ch}
.outro .omsg{font-family:'Press Start 2P',monospace;font-size:clamp(10px,2.8vw,12px);line-height:1.8;color:#e7c23f;margin:clamp(4px,2vh,18px) 0 0;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;max-width:46ch}
.outro .omsg span{min-width:0}
.outro .ico{width:27px;height:21px;image-rendering:pixelated;flex:none}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.salir{font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.4;letter-spacing:.02em;padding:8px 10px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink);cursor:pointer;margin:4px}
.salir:hover,.salir:focus-visible{background:var(--paper);color:var(--ink)}
.salida{display:flex;justify-content:center;margin-top:36px}
.fecha{font-family:var(--mono);font-size:12px;color:var(--muted);margin:14px 0 0;letter-spacing:.04em}
.pantallas{margin-top:18px;padding:14px 16px;border:1px dashed var(--mark);border-radius:4px;display:grid;gap:10px;background:var(--card)}
.pantallas h2{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;margin:0;letter-spacing:.03em}
.prow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:4px 14px;align-items:baseline}
.plab{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (max-width:560px){.prow{grid-template-columns:minmax(0,1fr)}}
</style>

</div>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
let TX = JSON.parse(document.getElementById('textos').textContent);
const TOPICS = [
  ["Gentrificación y desplazamiento","GEN"],["Derecho a la ciudad y movimientos urbanos","DER"],
  ["Mercado inmobiliario y urbanismo neoliberal","INM"],["Periurbanización y gentrificación rural","RUR"],
  ["Calidad de vida urbana","CAL"],["Espacio público y diseño urbano","ESP"],["Movilidad","MOV"],["Infancia y ciudad","INF"],["Género e inclusión","INC"],
  ["Ambiente y resiliencia urbana","AMB"],["Participación y gestión comunitaria","PAR"],
  ["Planificación y desarrollo regional","PLA"],["Teoría social","TEO"],["Clases medias, consumo y publicidad","CON"]];
const CODE = Object.fromEntries(TOPICS);
const label = t => (TX.temas && TX.temas[CODE[t]]) || t;
const COL = {Zotero:"Zotero de Nicolás",Drive:"Drive de Nicolás",Proyecto:"Proyecto Bibliografía urbanismo",FLACSO:"Derecho a la Ciudad (FLACSO)",
  SEDATU:"Biblioteca SEDATU",BUC:"Biblioteca Urbana Colaborativa",Infolibros:"Infolibros",Notebook:"Cuaderno Calidad de vida (NotebookLM)"};
const PAGE = 48;
const state = {tema:null,q:"",coleccion:"",tipo:"",lugar:"",orden:"anio-desc",desc:false};
let shown = PAGE, editing = false;
try{ const s = JSON.parse(localStorage.getItem('fichero-filtros-2')||'null'); if(s) Object.assign(state,s);}catch(e){}

const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
DATA.forEach(r=>{ r._call = CODE[r.temas[0]]+"-"+String(r.id).padStart(3,"0");
  r._txt = norm([r.autores,r.titulo,r.fuente,r.resumen,r.lugar,r.tipo,r.temas.join(" "),COL[r.origen]].join(" ")); });
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Editable texts ---------- */
const DEF = {portadaBoton:"entrar a la biblioteca :)", salirBoton:"SALIR DE LA BIBLIOTECA",
  outroTitulo:"gracias por visitar la biblioteca urbana nico", outroMensaje:"¡aguante la lectura y el conocimiento! \\o/",
  outroBoton:"Volver a entrar a la biblioteca :P", fecha:""};
const txt = k => TX[k] || DEF[k] || "";
function renderTexts(){
  document.querySelectorAll('[data-edit]').forEach(el=>{
    const v = txt(el.dataset.edit);
    if(el.hasAttribute('data-rich')) el.innerHTML = clean(v); else el.textContent = v;
  });
  document.querySelectorAll('[data-show]').forEach(el=>{ el.textContent = txt(el.dataset.show); });
  document.title = TX.titulo || "Fichero Urbano";
  const f = document.getElementById('notas');
  f.innerHTML = (TX.notas||[]).map((n,i)=>`<p data-nota="${i}">${clean(n)}</p>`).join("") +
    (editing ? `<button class="link addp" id="addp" type="button">Añadir párrafo</button>` : "");
  if(editing) f.querySelectorAll('[data-nota]').forEach(p=>{p.contentEditable="true"; p.setAttribute('data-edit','nota');});
}
function clean(html){
  const box = document.createElement('div'); box.innerHTML = html || "";
  const walk = node => [...node.childNodes].map(n=>{
    if(n.nodeType===3) return esc(n.textContent);
    if(n.nodeType!==1) return "";
    const tag = n.tagName.toLowerCase(), inner = walk(n);
    if(tag==="br") return "<br>";
    if(["b","strong"].includes(tag)) return `<b>${inner}</b>`;
    if(["i","em"].includes(tag)) return `<i>${inner}</i>`;
    if(tag==="a"){ const h=n.getAttribute('href')||"";
      if(/^mailto:[^\s"<>]+$/i.test(h)) return `<a href="${esc(h)}">${inner}</a>`;
      return /^https?:\/\//i.test(h) ? `<a href="${esc(h)}" target="_blank" rel="noopener">${inner}</a>` : inner; }
    return inner;
  }).join("");
  return walk(box).replace(/(<br>)+$/,"").trim();
}

/* ---------- Catalogue ---------- */
function opts(id, values, first, names){
  document.getElementById(id).innerHTML = `<option value="">${first}</option>` +
    values.map(v=>`<option value="${esc(v)}">${esc(names?names[v]||v:v)}</option>`).join("");
}
opts('coleccion', Object.keys(COL).filter(k=>DATA.some(r=>r.origen===k)), "Todas las colecciones", COL);
opts('tipo', [...new Set(DATA.map(r=>r.tipo))].sort((a,b)=>a.localeCompare(b,"es")), "Todos los tipos");
opts('lugar', [...new Set(DATA.map(r=>r.lugar))].sort((a,b)=>a.localeCompare(b,"es")), "Todos los lugares");

function renderStats(){
  const dl = DATA.filter(r=>r.descarga).length;
  const cols = Object.keys(COL).filter(k=>DATA.some(r=>r.origen===k)).length;
  document.getElementById('stats').innerHTML = `<span><b>${DATA.length}</b> fichas</span><span><b>${dl}</b> con descarga</span><span><b>${cols}</b> colecciones</span>`;
}
function renderTopics(){
  const counts = TOPICS.map(([t])=>DATA.filter(r=>r.temas.includes(t)).length);
  const max = Math.max(...counts);
  document.getElementById('topics').innerHTML = TOPICS.map(([t,c],i)=>
    `<${editing?'div':'button'} class="topic"${editing?'':' type="button"'} data-t="${esc(t)}" aria-pressed="${state.tema===t}">
      <span class="code">${c}</span><span class="tlabel" data-code="${c}"${editing?' contenteditable="true"':''}>${esc(label(t))}</span><span class="n">${counts[i]}</span>
      <span class="bar"><i style="width:${(counts[i]/max*100).toFixed(0)}%"></i></span></${editing?'div':'button'}>`).join("");
}
document.getElementById('topics').addEventListener('click',e=>{
  if(editing) return;
  const b = e.target.closest('.topic'); if(!b) return;
  state.tema = state.tema===b.dataset.t ? null : b.dataset.t; shown = PAGE; update();
});
document.getElementById('topics').addEventListener('keydown',e=>{ if(editing && e.key==="Enter"){ e.preventDefault(); } });
document.getElementById('topics').addEventListener('keyup',e=>{ if(editing && e.key===" "){ e.preventDefault(); } });

function apa(r){ return `${r.autores} (${r.anio}). ${r.titulo}. ${r.fuente}.` + (r.enlace==="buscar" ? "" : ` ${r.url}`); }
function srcLabel(r){
  if(r.origen==="BUC") return "Ficha BUC";
  if(r.origen==="Infolibros") return "Ficha Infolibros";
  if(r.origen==="SEDATU") return "Ver en gob.mx";
  return r.enlace==="doi" ? "Abrir DOI" : r.enlace==="web" ? "Ver fuente" : "Buscar";
}
function dlLabel(r){ return r.dl_label || (/\.docx(\?|$)/i.test(r.descarga) ? "Descargar DOCX" : "Descargar PDF"); }

function filtered(){
  const q = norm(state.q).split(/\s+/).filter(Boolean);
  let rows = DATA.filter(r =>
    (!state.tema || r.temas.includes(state.tema)) && (!state.coleccion || r.origen===state.coleccion) &&
    (!state.tipo || r.tipo===state.tipo) && (!state.lugar || r.lugar===state.lugar) &&
    (!state.desc || r.descarga) && q.every(w=>r._txt.includes(w)));
  const yr = r => r.anio==="s.f." ? -1 : +r.anio;
  if(state.orden==="anio-desc") rows.sort((a,b)=>yr(b)-yr(a));
  if(state.orden==="anio-asc") rows.sort((a,b)=>(yr(a)<0?9999:yr(a))-(yr(b)<0?9999:yr(b)));
  if(state.orden==="autor") rows.sort((a,b)=>a.autores.localeCompare(b.autores,"es"));
  if(state.orden==="titulo") rows.sort((a,b)=>a.titulo.localeCompare(b.titulo,"es"));
  return rows;
}
function card(r){
  const tags = [
    r.propio ? '<span class="tag own">Autoría de Nicolás</span>' : '',
    ["FLACSO","SEDATU","BUC","Infolibros"].includes(r.origen) ? `<span class="tag col">${esc(COL[r.origen])}</span>` : '',
    r.restringido ? '<span class="tag lock">Con derechos: sin descarga</span>' : '',
    `<span class="tag">${esc(r.tipo)}</span>`, `<span class="tag">${esc(r.lugar)}</span>`,
    ...r.temas.slice(1).map(t=>`<span class="tag" title="${esc(label(t))}">${CODE[t]}</span>`)].join("");
  return `<article class="card">
    <div class="top"><span class="call" title="${esc(label(r.temas[0]))}">${r._call}</span><span class="year">${esc(r.anio)}</span></div>
    <h3 class="title">${esc(r.titulo)}</h3>
    <div><div class="authors">${esc(r.autores)}</div><div class="src">${esc(r.fuente)}</div></div>
    ${r.resumen ? `<p class="sum">${esc(r.resumen)}</p>` : '<span></span>'}
    <div>
      <div class="meta">${tags}</div>
      <div class="actions">
        ${r.descarga ? `<a class="btn" href="${esc(r.descarga)}" target="_blank" rel="noopener">${esc(dlLabel(r))}</a>` : ""}
        ${(r.extra||[]).map(([l,u])=>`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">PDF: ${esc(l)}</a>`).join("")}
        <a class="btn ${r.descarga||(r.extra||[]).length?"ghost":""}" href="${esc(r.url)}" target="_blank" rel="noopener">${srcLabel(r)}</a>
        <button class="btn ghost" type="button" data-cite="${r.id}">Copiar cita</button>
      </div>
    </div>
  </article>`;
}
function render(){
  const rows = filtered();
  document.getElementById('count').textContent = `${rows.length} de ${DATA.length} fichas`;
  document.getElementById('grid').innerHTML = rows.length ? rows.slice(0,shown).map(card).join("")
    : `<p class="empty">No hay fichas con esos filtros. Prueba otra palabra o limpia los filtros.</p>`;
  const m = document.getElementById('more');
  m.hidden = rows.length <= shown;
  m.textContent = `Mostrar más fichas (${rows.length - shown} restantes)`;
}
document.getElementById('more').addEventListener('click',()=>{ shown += PAGE; render(); });

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
document.getElementById('grid').addEventListener('click', e=>{
  const b = e.target.closest('[data-cite]'); if(!b) return;
  const r = DATA.find(x=>x.id==b.dataset.cite); const txt = apa(r);
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy'); toast('Cita copiada');}catch(_){toast('Selecciona y copia la cita');} ta.remove(); };
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('Cita copiada'),fallback); else fallback();
});

function update(){
  try{localStorage.setItem('fichero-filtros-2',JSON.stringify(state));}catch(e){}
  ['q','coleccion','tipo','lugar','orden'].forEach(k=>{ const el=document.getElementById(k); if(el.value!==state[k]) el.value=state[k]; });
  document.getElementById('desc').checked=!!state.desc;
  renderTopics(); render();
}
['q','coleccion','tipo','lugar','orden'].forEach(k=>document.getElementById(k).addEventListener(k==='q'?'input':'change',e=>{state[k]=e.target.value; shown=PAGE; update();}));
document.getElementById('desc').addEventListener('change',e=>{state.desc=e.target.checked; shown=PAGE; update();});
document.getElementById('reset').addEventListener('click',()=>{Object.assign(state,{tema:null,q:"",coleccion:"",tipo:"",lugar:"",orden:"anio-desc",desc:false}); shown=PAGE; update();});

/* ---------- Edit mode (owner and editors) ---------- */
let artifactNS = null;
const RESET_CSS = (document.head.querySelector('style')||{}).textContent || ":root{color-scheme:light}body{margin:0}";
function setEditing(on){
  editing = on;
  document.body.classList.toggle('editing', on);
  document.getElementById('editbar').hidden = !on;
  document.getElementById('pantallas').hidden = !on;
  document.getElementById('editbtn').hidden = on || !artifactNS;
  document.querySelectorAll('[data-edit]').forEach(el=>{ if(on) el.contentEditable = "true"; else el.removeAttribute('contenteditable'); });
  renderTexts(); renderTopics();
  if(on) document.querySelectorAll('[data-edit]').forEach(el=>el.contentEditable="true");
}
function collect(){
  const t = JSON.parse(JSON.stringify(TX));
  document.querySelectorAll('header [data-edit], .strip [data-edit], .pantallas [data-edit], .fecha[data-edit]').forEach(el=>{
    t[el.dataset.edit] = el.hasAttribute('data-rich') ? clean(el.innerHTML) : el.textContent.replace(/\s+/g," ").trim();
  });
  t.temas = t.temas || {};
  document.querySelectorAll('.tlabel').forEach(s=>{ const v = s.textContent.replace(/\s+/g," ").trim(); if(v) t.temas[s.dataset.code] = v; });
  t.notas = [...document.querySelectorAll('#notas [data-nota]')].map(p=>clean(p.innerHTML)).filter(Boolean);
  if(!t.titulo) t.titulo = TX.titulo;
  return t;
}
function decodeB64(b){ const bin = atob(b.trim()); const bytes = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function buildPage(t){
  const tplB64 = document.getElementById('tpl').textContent.trim();
  const json = JSON.stringify(t).replace(/</g,"\\u003c");
  const titleTxt = esc(t.titulo || "Fichero Urbano");
  const content = decodeB64(tplB64).split("__TEX"+"TOS__").join(json).split("__T"+"PL__").join(tplB64).split("__TI"+"TLE__").join(titleTxt);
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
    RESET_CSS + '</style></head><body>' + content + '</body></html>';
}
document.getElementById('editbtn').addEventListener('click',()=>setEditing(true));
document.getElementById('cancel').addEventListener('click',()=>{ setEditing(false); });
document.getElementById('notas').addEventListener('click',e=>{
  if(e.target.id!=="addp") return;
  const p = document.createElement('p'); p.dataset.nota = "n"; p.contentEditable="true"; p.setAttribute('data-edit','nota');
  p.textContent = "Nuevo párrafo"; e.target.before(p); p.focus();
});
document.getElementById('save').addEventListener('click', async ()=>{
  const msg = document.getElementById('editmsg'), btn = document.getElementById('save');
  const t = collect();
  btn.disabled = true; msg.textContent = "Guardando…";
  try{
    await artifactNS.publish(buildPage(t));
    msg.textContent = "Guardado. La página se recarga con los textos nuevos.";
  }catch(err){
    btn.disabled = false;
    const c = err && err.code;
    if(c==="conflict") msg.textContent = "Alguien guardó otra versión al mismo tiempo. La página se recarga con esa versión.";
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled"){ msg.textContent = "Esta vista es de solo lectura: no se pueden guardar cambios aquí."; document.getElementById('editbtn').remove(); }
    else if(c==="rate_limited") msg.textContent = "Se guardó hace muy poco. Espera un momento y vuelve a intentarlo.";
    else msg.textContent = "No se pudo guardar. Intenta de nuevo en unos segundos.";
  }
});
(async ()=>{
  try{
    if(!window.claude || !claude.use) return;
    const [a, u] = await Promise.all([claude.use("artifact"), claude.use("user")]);
    const can = u ? await u.canEdit() : false;
    if(a && can){ artifactNS = a; document.getElementById('editbtn').hidden = false; }
  }catch(e){}
})();

renderTexts(); renderStats(); update();

/* ---------- Portada y salida 8 bits ---------- */
(function(){
  const cover = document.getElementById('portada'), outro = document.getElementById('outro'); if(!cover || !outro) return;
  const c = document.getElementById('pcanvas').getContext('2d'), cur = document.getElementById('pcur');
  const oc = document.getElementById('ocanvas').getContext('2d');
  const icos = [...outro.querySelectorAll('.ico')].map(x=>x.getContext('2d'));
  const W=64,H=40, R=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  const hs=(a,b,d)=>{let n=Math.sin(a*12.9898+b*78.233+d*37.719)*43758.5453;return n-Math.floor(n)};
  const stars=[...Array(18)].map((_,i)=>[Math.floor(hs(i,1,2)*64),Math.floor(hs(i,3,4)*8)]);
  /* Gusano con lentes que se come un libro parado desde arriba */
  function drawWorm(f){
    const P=(x,y,w,h,col)=>{oc.fillStyle=col;oc.fillRect(x,y,w,h)};
    P(0,0,W,H,'#000');
    stars.forEach((s,i)=>{ if((f+i*7)%29>3) P(s[0],s[1],1,1,i%3?'#666':'#bbb'); });
    P(0,35,W,5,'#3a2a1a'); P(0,35,W,1,'#5a4030');
    const T=150, p=f%T, E=24, eat=Math.min(E,Math.floor(p*E/110)), top=7+eat, full=p>=110;
    const x0=24, bw=16;
    const B=(x,y,w,h,col)=>{ const y1=Math.max(y,top+2), y2=Math.min(y+h,35); if(y2>y1) P(x,y1,w,y2-y1,col); };
    B(x0,0,bw,40,'#7a2e2e'); B(x0,0,2,40,'#5a1e1e'); B(x0+bw-1,0,1,40,'#5e2222');
    B(x0+4,11,9,1,'#e7c23f'); B(x0+5,13,7,1,'#e7c23f');
    B(x0+4,18,9,6,'#f2e8cf'); B(x0+5,19,6,1,'#9a8f78'); B(x0+5,21,7,1,'#9a8f78');
    B(x0+4,29,9,1,'#e7c23f');
    for(let x=x0;x<x0+bw;x++){
      const bite = top>7 && hs(x,eat,7)>.6;
      if(!bite) P(x,top,1,1,'#f2e8cf');
      P(x,top+1,1,1,(x%2)?'#f2e8cf':'#d8cdb4');
    }
    const hx = t => x0 + 1 + Math.round((Math.sin(t*0.12)+1)/2*(bw-6));
    const ft = full ? 110 : p, chew = !full && (f%4<2);
    const n = 4 + Math.floor(eat/5), sz = eat>=14 ? 3 : 2;
    for(let k=n;k>=1;k--){
      const sx = hx(ft-k*2)+1, sy = top - sz - (((f+k)%6<3)?0:1);
      P(sx,sy,sz,sz,k%2?'#639922':'#97c459');
    }
    const X=hx(ft), dir = hx(ft)-hx(ft-1)>=0 ? 1 : -1, Y=top-4-(chew?0:1);
    P(X,Y,4,4,'#97c459'); P(X,Y+1,4,1,'#111'); P(X+1,Y+1,1,1,'#fff'); P(X+3,Y+1,1,1,'#fff');
    if(chew) P(dir>0?X+3:X,Y+3,1,1,'#111');
    if(!full) for(let j=0;j<6;j++){ const t=(f+j*5)%12, cx=hx(p-t)+(j%3), cy=top-1+t*2; if(cy<35) P(cx,cy,1,1,j%2?'#f2e8cf':'#b8a98a'); }
    if(full && (f%10<6)){ const hX=X, hY=Y-7; ['.x.x.','xxxxx','.xxx.','..x..'].forEach((r,yy)=>[...r].forEach((ch,xx)=>{ if(ch==='x') P(hX+xx,hY+yy,1,1,'#ed93b1'); })); }
  }
  function drawIcons(f){
    const flip = Math.floor(f/8)%2;
    icos.forEach((g,i)=>{ const Q=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
      g.clearRect(0,0,9,7); Q(0,1,9,6,'#7a2e2e'); Q(1,0,3,6,'#f2e8cf'); Q(5,0,3,6,'#f2e8cf'); Q(4,0,1,6,'#b8a98a');
      Q(2,2,1,1,'#9a8f78'); Q(6,2,1,1,'#9a8f78'); Q(2,4,1,1,'#9a8f78'); Q(6,4,1,1,'#9a8f78');
      if((flip+i)%2) Q(5,0,2,6,'#fffaf0'); else Q(2,0,2,6,'#fffaf0'); });
  }
  function draw(f){
    R(0,0,W,H,'#000');
    stars.forEach((s,i)=>{ if((f+i*7)%29>3) R(s[0],s[1],1,1,i%3?'#888':'#fff'); });
    R(10,11,44,22,'#7a2e2e'); R(12,9,20,21,'#f2e8cf'); R(33,9,20,21,'#f2e8cf'); R(32,9,1,22,'#b8a98a');
    for(let y=12;y<28;y+=3){ R(14,y,14-(y%4),1,'#9a8f78'); R(35,y,15-(y%5),1,'#9a8f78'); }
    const t=(f%24)/24;
    if(t<.5){ const w=Math.round(20*(1-2*t)); R(33,9-(w<10?1:0),w,21,'#fffaf0'); R(33+w-1,9,1,21,'#d8cdb4'); }
    else{ const w=Math.round(20*(2*t-1)); R(32-w,9-(w<10?1:0),w,21,'#fffaf0'); R(32-w,9,1,21,'#d8cdb4'); }
    [[18,3],[44,2],[30,1],[50,5],[12,4]].forEach(([x,y],i)=>{ if((f+i*5)%16<8){ R(x,y,1,1,'#e7c23f'); R(x-1,y+1,3,1,'#e7c23f'); R(x,y+2,1,1,'#e7c23f'); } });
    R(16,34,32,2,'#3a2a1a');
    cur.style.visibility = (Math.floor(f/6)%2) ? 'hidden' : 'visible';
  }
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let f=0, timer=null, screen=null;
  function frame(){ if(screen==='portada') draw(f); else if(screen==='outro'){ drawWorm(f); drawIcons(f); } }
  function show(which){
    screen = which; f = still ? 60 : 0;
    cover.hidden = which!=='portada'; outro.hidden = which!=='outro';
    document.body.classList.toggle('cubierta', !!which);
    if(timer){ clearInterval(timer); timer=null; }
    if(which){ frame(); if(!still) timer = setInterval(()=>{ f++; frame(); }, 85); }
  }
  show('portada');
  document.getElementById('entrar').addEventListener('click',()=>{ show(null); window.scrollTo(0,0); });
  document.querySelectorAll('[data-salir]').forEach(b=>b.addEventListener('click',()=>{
    if(editing) return;
    show('outro'); try{ document.getElementById('volver').focus({preventScroll:true}); }catch(e){}
  }));
  document.getElementById('volver').addEventListener('click',()=>{ show('portada'); window.scrollTo(0,0); });
})();
</script>
